name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-docker:
    uses: ./.github/workflows/relay-docker.yml
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Show Apple build toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --show-sdk-path
      - name: Set up Go for relay
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: relay/go.mod
          cache: false
      - name: Verify relay build toolchain
        run: go version
      - name: Run project checks
        run: ./scripts/run-all-checks.sh
      - name: Generate temporary update signing key
        run: |
          swift build --product QuietDeskUpdateTool
          tool="$(swift build --show-bin-path)/QuietDeskUpdateTool"
          public_key="$("$tool" generate-key --out "$RUNNER_TEMP/quietdesk-update-test-key")"
          echo "QUIETDESK_UPDATE_PUBLIC_KEYS=[$public_key]" >> "$GITHUB_ENV"
      - name: Build Universal application
        env:
          QUIETDESK_BUNDLE_IDENTIFIER: local.quietdesk.checks.updater
          QUIETDESK_UPDATE_FEED_URL: http://127.0.0.1:1/QuietDesk-update.json
        run: ./build-app.sh
      - name: Sign and verify temporary update manifest
        run: |
          tool="$(swift build --show-bin-path)/QuietDeskUpdateTool"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/QuietDesk.app/Contents/Info.plist)"
          archive="$RUNNER_TEMP/QuietDesk-$version-macOS-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/QuietDesk.app "$archive"
          export QUIETDESK_UPDATE_SIGNING_KEY="$(cat "$RUNNER_TEMP/quietdesk-update-test-key")"
          "$tool" sign --app dist/QuietDesk.app --archive "$archive" --tag "v$version" --repository nXiaoK/QuietDesk --out "$RUNNER_TEMP/QuietDesk-update.json"
          "$tool" verify --app dist/QuietDesk.app --archive "$archive" --manifest "$RUNNER_TEMP/QuietDesk-update.json"
          python3 scripts/check-update-tool.py --tool "$tool" --work "$RUNNER_TEMP/quietdesk-update-tool-checks"
      - name: Remove temporary update signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/quietdesk-update-test-key"
      - name: Build Linux relay packages
        run: ./scripts/build-relay.sh
      - name: Check application metadata
        run: |
          plutil -lint dist/QuietDesk.app/Contents/Info.plist
          xcrun lipo dist/QuietDesk.app/Contents/MacOS/QuietDesk -verify_arch arm64 x86_64
          xcrun vtool -show-build dist/QuietDesk.app/Contents/MacOS/QuietDesk
