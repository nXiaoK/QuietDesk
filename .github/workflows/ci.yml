name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go for relay
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: relay/go.mod
          cache: false
      - name: Verify relay build toolchain
        run: go version
      - name: Run project checks
        run: ./scripts/run-all-checks.sh
      - name: Build Universal application
        run: ./build-app.sh
      - name: Build Linux relay packages
        run: ./scripts/build-relay.sh
      - name: Check application metadata
        run: |
          plutil -lint dist/QuietDesk.app/Contents/Info.plist
          xcrun lipo dist/QuietDesk.app/Contents/MacOS/QuietDesk -verify_arch arm64 x86_64
