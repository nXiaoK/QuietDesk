name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-docker:
    uses: ./.github/workflows/relay-docker.yml

  windows-cross:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' windows/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          rustup target add --toolchain "$channel" x86_64-pc-windows-gnullvm aarch64-pc-windows-gnullvm
      - name: Run Windows Rust and macOS interop checks
        run: |
          source scripts/windows-toolchain.sh
          (cd windows && cargo fmt --check)
          (cd windows && cargo clippy --locked --all-targets -- -D warnings)
          (cd windows && cargo clippy --locked --target x86_64-pc-windows-gnullvm -p quietdesk-app --all-targets -- -D warnings)
          (cd windows && cargo clippy --locked --target aarch64-pc-windows-gnullvm -p quietdesk-app --all-targets -- -D warnings)
          ./scripts/run-windows-interop-checks.sh
      - name: Build Windows x64 and ARM64 portable packages
        run: ./scripts/build-windows.sh all
      - name: Upload Windows portable packages for installer build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: QuietDesk-Windows-CI
          path: |
            outputs/windows/QuietDesk-*-Windows-x64.zip
            outputs/windows/QuietDesk-*-Windows-arm64.zip
            outputs/windows/SHA256SUMS-*-Windows.txt
          if-no-files-found: error

  windows-installer:
    needs: windows-cross
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download cross-built Windows portable packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path outputs/windows | Out-Null
          gh run download "$env:GITHUB_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name QuietDesk-Windows-CI --dir outputs/windows
      - name: Package Windows x64 and ARM64 Inno Setup installers
        shell: pwsh
        run: python scripts/package-windows-installer.py --dist-dir outputs/windows
      - name: Verify silent install and uninstall on Windows x64
        shell: pwsh
        run: |
          $version = (python scripts/version.py current)[0].Trim()
          $setup = Resolve-Path "outputs/windows/QuietDesk-$version-Windows-x64-Setup.exe"
          $armSetup = Resolve-Path "outputs/windows/QuietDesk-$version-Windows-arm64-Setup.exe"
          if ((Get-Item $armSetup).Length -le 0) { throw "Empty ARM64 installer" }
          $installDir = Join-Path $env:RUNNER_TEMP "quietdesk-ci-install"
          $proc = Start-Process -FilePath $setup -ArgumentList @("/SP-", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOCANCEL", "/DIR=$installDir") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer exited with $($proc.ExitCode)" }
          foreach ($file in @("QuietDesk.exe", "LICENSE", "THIRD-PARTY-OPUS.txt", "unins000.exe")) {
            if (-not (Test-Path (Join-Path $installDir $file))) { throw "Missing installed file: $file" }
          }
          $unins = Start-Process -FilePath (Join-Path $installDir "unins000.exe") -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($unins.ExitCode -ne 0) { throw "Uninstaller exited with $($unins.ExitCode)" }
          for ($i = 0; $i -lt 50 -and (Test-Path (Join-Path $installDir "QuietDesk.exe")); $i++) {
            Start-Sleep -Milliseconds 200
          }
          if (Test-Path (Join-Path $installDir "QuietDesk.exe")) { throw "QuietDesk.exe remained after uninstall" }

  check:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Show Apple build toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --show-sdk-path
      - name: Set up Go for relay
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: relay/go.mod
          cache: false
      - name: Verify relay build toolchain
        run: go version
      - name: Run project checks
        run: ./scripts/run-all-checks.sh
      - name: Generate temporary update signing key
        run: |
          swift build --product QuietDeskUpdateTool
          tool="$(swift build --show-bin-path)/QuietDeskUpdateTool"
          public_key="$("$tool" generate-key --out "$RUNNER_TEMP/quietdesk-update-test-key")"
          echo "QUIETDESK_UPDATE_PUBLIC_KEYS=[$public_key]" >> "$GITHUB_ENV"
      - name: Build Universal application
        env:
          QUIETDESK_BUNDLE_IDENTIFIER: local.quietdesk.checks.updater
          QUIETDESK_UPDATE_FEED_URL: http://127.0.0.1:1/QuietDesk-update.json
        run: ./build-app.sh
      - name: Sign and verify temporary update manifest
        run: |
          tool="$(swift build --show-bin-path)/QuietDeskUpdateTool"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/QuietDesk.app/Contents/Info.plist)"
          archive="$RUNNER_TEMP/QuietDesk-$version-macOS-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/QuietDesk.app "$archive"
          export QUIETDESK_UPDATE_SIGNING_KEY="$(cat "$RUNNER_TEMP/quietdesk-update-test-key")"
          "$tool" sign --app dist/QuietDesk.app --archive "$archive" --tag "v$version" --repository nXiaoK/QuietDesk --out "$RUNNER_TEMP/QuietDesk-update.json"
          "$tool" verify --app dist/QuietDesk.app --archive "$archive" --manifest "$RUNNER_TEMP/QuietDesk-update.json"
          python3 scripts/check-update-tool.py --tool "$tool" --work "$RUNNER_TEMP/quietdesk-update-tool-checks"
      - name: Remove temporary update signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/quietdesk-update-test-key"
      - name: Build Linux relay packages
        run: ./scripts/build-relay.sh
      - name: Check application metadata
        run: |
          plutil -lint dist/QuietDesk.app/Contents/Info.plist
          xcrun lipo dist/QuietDesk.app/Contents/MacOS/QuietDesk -verify_arch arm64 x86_64
          xcrun vtool -show-build dist/QuietDesk.app/Contents/MacOS/QuietDesk
