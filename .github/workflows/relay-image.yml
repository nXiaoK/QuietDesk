name: Publish relay image

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Resolve image name
        id: image
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          printf 'name=ghcr.io/%s-relay\n' "$repository" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push commit image
        id: build-first
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with: &relay-build-inputs
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=QuietDesk relay
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          cache-from: type=gha,scope=quietdesk-relay
          cache-to: type=gha,mode=max,scope=quietdesk-relay
      - name: Wait before second image build attempt
        if: steps.build-first.outcome == 'failure'
        run: sleep 15
      - name: Retry building and pushing commit image
        id: build-second
        if: steps.build-first.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with: *relay-build-inputs
      - name: Wait before final image build attempt
        if: steps.build-second.outcome == 'failure'
        run: sleep 30
      - name: Final attempt to build and push commit image
        id: build-third
        if: steps.build-second.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with: *relay-build-inputs
      - name: Select successful build digest
        id: build
        env:
          RELAY_DIGEST: ${{ steps.build-first.outcome == 'success' && steps.build-first.outputs.digest || steps.build-second.outcome == 'success' && steps.build-second.outputs.digest || steps.build-third.outcome == 'success' && steps.build-third.outputs.digest }}
        run: |
          if [[ ! "$RELAY_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Image build did not return a valid digest.'
            exit 1
          fi
          printf 'digest=%s\n' "$RELAY_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Check published image without application sources
        env:
          RELAY_IMAGE: ${{ steps.image.outputs.name }}
          RELAY_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 scripts/check-relay-docker.py --image "$RELAY_IMAGE@$RELAY_DIGEST"
          python3 scripts/check-relay-docker.py --self-signed --image "$RELAY_IMAGE@$RELAY_DIGEST"
      - name: Promote verified image
        env:
          RELAY_IMAGE: ${{ steps.image.outputs.name }}
          RELAY_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "$RELAY_IMAGE:latest" --tag "$RELAY_IMAGE:main" \
            "$RELAY_IMAGE@$RELAY_DIGEST"
          printf '### Relay image\n\n- Image: `%s:latest`\n- Source: `%s`\n- Pinned image: `%s@%s`\n- Platforms: `linux/amd64`, `linux/arm64`\n' \
            "$RELAY_IMAGE" "$GITHUB_SHA" "$RELAY_IMAGE" "$RELAY_DIGEST" >> "$GITHUB_STEP_SUMMARY"
