name: Build and release macOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment (auto uses the initial version, then increments patch)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: quietdesk-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Allocate version
        id: version
        env:
          INCREMENT: ${{ inputs.increment || 'auto' }}
        run: python3 scripts/version.py next --increment "$INCREMENT" --github-output
      - name: Check version allocation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check protocol, clipboard and video
        run: swift run --disable-sandbox QuietDeskChecks
      - name: Check application behavior without system permissions
        run: |
          ./scripts/run-app-checks.sh
          ./scripts/run-input-checks.sh
          ./scripts/run-video-checks.sh
          ./scripts/run-session-data-checks.sh
          ./scripts/run-session-effects-checks.sh
          ./scripts/run-traffic-checks.sh
          ./scripts/run-log-checks.sh
          ./scripts/run-credential-checks.sh
          ./scripts/run-permission-checks.sh
      - name: Build Universal application
        env:
          QUIETDESK_VERSION: ${{ steps.version.outputs.version }}
          QUIETDESK_BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: ./build-app.sh
      - name: Package DMG, ZIP and source
        run: python3 scripts/package-app.py
      - name: Save packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: QuietDesk-${{ steps.version.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD: ${{ steps.version.outputs.build }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_LATEST: ${{ steps.version.outputs.latest }}
        run: |
          if ! git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            remote_head="$(git ls-remote --heads origin main | cut -f1)"
            if [[ "$remote_head" != "$(git rev-parse HEAD)" ]]; then
              echo '::notice::A newer main commit exists; its workflow will publish the next release.'
              exit 0
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            printf 'QuietDesk %s\n\nWorkflow-Run: %s\nBuild-Number: %s\n' "$RELEASE_VERSION" "$GITHUB_RUN_ID" "$RELEASE_BUILD" > "$RUNNER_TEMP/quietdesk-tag.txt"
            git tag -a "$RELEASE_TAG" -F "$RUNNER_TEMP/quietdesk-tag.txt"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" == "$(git rev-parse HEAD)" ]]
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "QuietDesk $RELEASE_VERSION"
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/QuietDesk-$RELEASE_VERSION-macOS-universal.dmg" \
            "dist/QuietDesk-$RELEASE_VERSION-macOS-universal.zip" \
            "dist/QuietDesk-$RELEASE_VERSION-Source.zip" \
            "dist/SHA256SUMS-$RELEASE_VERSION.txt"
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$RELEASE_LATEST"
          fi
