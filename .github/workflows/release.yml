name: Build and release macOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment (auto uses the initial version, then increments patch)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: quietdesk-release
  cancel-in-progress: false

jobs:
  relay-docker:
    uses: ./.github/workflows/relay-docker.yml
  relay-image:
    needs: relay-docker
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/relay-image.yml
  release:
    needs: relay-docker
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go for relay
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: relay/go.mod
          cache: false
      - name: Allocate version
        id: version
        env:
          INCREMENT: ${{ inputs.increment || 'auto' }}
        run: python3 scripts/version.py next --increment "$INCREMENT" --github-output
      - name: Preflight update signing
        id: update-signing
        env:
          QUIETDESK_UPDATE_SIGNING_KEY: ${{ secrets.QUIETDESK_UPDATE_SIGNING_KEY }}
        run: |
          enabled="$(python3 -c 'import json; print(str(bool(json.load(open("Resources/update-feed.json"))["publicKeys"])).lower())')"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [[ "$enabled" != true ]]; then
            echo '::warning::Update public key table is empty; this release will not include an update manifest.'
            exit 0
          fi
          if [[ -z "$QUIETDESK_UPDATE_SIGNING_KEY" ]]; then
            echo '::error::请设置 QUIETDESK_UPDATE_SIGNING_KEY 后重跑。'
            exit 1
          fi
          swift build --product QuietDeskUpdateTool
          tool="$(swift build --show-bin-path)/QuietDeskUpdateTool"
          if ! "$tool" check-key --config Resources/update-feed.json; then
            echo '::error::请设置匹配的 QUIETDESK_UPDATE_SIGNING_KEY 后重跑。'
            exit 1
          fi
      - name: Verify relay build toolchain
        run: go version
      - name: Run project checks
        run: ./scripts/run-all-checks.sh
      - name: Build Universal application
        env:
          QUIETDESK_VERSION: ${{ steps.version.outputs.version }}
          QUIETDESK_BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: ./build-app.sh
      - name: Package DMG, ZIP and source
        run: python3 scripts/package-app.py
      - name: Build Linux relay packages
        env:
          QUIETDESK_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-relay.sh
      - name: Create draft release and upload packages
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD: ${{ steps.version.outputs.build }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [[ "$remote_head" != "$(git rev-parse HEAD)" ]]; then
              echo '::notice::A newer main commit exists; its workflow will publish the next release.'
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            printf 'QuietDesk %s\n\nWorkflow-Run: %s\nBuild-Number: %s\n' "$RELEASE_VERSION" "$GITHUB_RUN_ID" "$RELEASE_BUILD" > "$RUNNER_TEMP/quietdesk-tag.txt"
            git tag -a "$RELEASE_TAG" -F "$RUNNER_TEMP/quietdesk-tag.txt"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" == "$(git rev-parse HEAD)" ]]
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "QuietDesk $RELEASE_VERSION"
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/QuietDesk-$RELEASE_VERSION-macOS-universal.dmg" \
            "dist/QuietDesk-$RELEASE_VERSION-macOS-universal.zip" \
            "dist/QuietDesk-$RELEASE_VERSION-Source.zip" \
            "dist/SHA256SUMS-$RELEASE_VERSION.txt" \
            outputs/relay/*.tar.gz outputs/relay/SHA256SUMS.txt
      - name: Sign update manifest
        if: steps.draft.outputs.skip != 'true' && steps.update-signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          QUIETDESK_UPDATE_SIGNING_KEY: ${{ secrets.QUIETDESK_UPDATE_SIGNING_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/quietdesk-release-notes.txt"
          swift build --product QuietDeskUpdateTool
          tool="$(swift build --show-bin-path)/QuietDeskUpdateTool"
          "$tool" sign --app dist/QuietDesk.app --archive "dist/QuietDesk-$RELEASE_VERSION-macOS-universal.zip" \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/quietdesk-release-notes.txt" --out dist/QuietDesk-update.json
          "$tool" verify --app dist/QuietDesk.app --archive "dist/QuietDesk-$RELEASE_VERSION-macOS-universal.zip" --manifest dist/QuietDesk-update.json
      - name: Save packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: QuietDesk-${{ steps.version.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/QuietDesk-update.json
            dist/SHA256SUMS-*.txt
            outputs/relay/*.tar.gz
            outputs/relay/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish verified release
        if: steps.draft.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_LATEST: ${{ steps.version.outputs.latest }}
          UPDATE_SIGNING_ENABLED: ${{ steps.update-signing.outputs.enabled }}
        run: |
          if [[ "$UPDATE_SIGNING_ENABLED" == true ]]; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/QuietDesk-update.json
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$RELEASE_LATEST"
          fi
