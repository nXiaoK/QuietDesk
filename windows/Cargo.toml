[workspace]
resolver = "3"
members = ["core", "probe"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
quietdesk-core = { path = "core" }
log = "0.4.34"
openssl = { version = "0.10.82", features = ["vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-openssl = "0.6.5"
uuid = { version = "1.29.2", features = ["serde", "v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
